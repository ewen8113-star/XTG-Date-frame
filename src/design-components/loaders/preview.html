<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dino Loader Preview</title>
    <link rel="stylesheet" href="./DinoLoader.css" />
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f4f5; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { width: min(680px, calc(100vw - 48px)); padding: 36px; background: #fff; border: 1px solid #e4e4e7; border-radius: 18px; box-shadow: 0 20px 50px rgb(24 24 27 / 10%); }
      h1 { margin: 0 0 8px; color: #18181b; font-size: 22px; }
      p { margin: 0 0 20px; color: #71717a; font-size: 14px; }
    </style>
  </head>
  <body>
    <main>
      <h1>恐龙 Loading</h1>
      <p>设计组件库预览，尚未接入业务页面。</p>
      <div class="design-dino-loader" role="status" aria-label="正在同步鑫通告数据">
        <span class="design-dino-runner"></span>
        <span class="design-dino-ground"></span>
        <span class="design-dino-loading-label"><strong class="design-dino-percentage">68%</strong><span>正在同步鑫通告数据</span></span>
      </div>
    </main>
    <script>
      const loader = document.querySelector(".design-dino-loader");
      let previousWidth = 0;
      function configureMotion() {
        const trackWidth = Math.max(280, Math.round(loader.getBoundingClientRect().width));
        if (trackWidth === previousWidth) return;
        previousWidth = trackWidth;
        const speed = 300;
        const obstacleCount = Math.max(1, Math.min(4, Math.round(trackWidth / 360)));
        const travelDistance = trackWidth + 67;
        const trackDuration = travelDistance / speed;
        const jumpDuration = trackDuration / obstacleCount;
        const collisionTime = (trackWidth / 2 + 58.5) / speed;
        loader.style.setProperty("--dino-jump-duration", `${jumpDuration}s`);
        loader.style.setProperty("--dino-travel-distance", `${travelDistance}px`);
        loader.querySelectorAll(".design-dino-obstacle").forEach((item) => item.remove());
        const ground = loader.querySelector(".design-dino-ground");
        Array.from({ length: obstacleCount }, (_, index) => {
          const desiredCollision = jumpDuration * (index + 0.5);
          const initialPhase = (collisionTime - desiredCollision + trackDuration) % trackDuration;
          const obstacle = document.createElement("span");
          obstacle.className = "design-dino-obstacle";
          obstacle.style.animationDuration = `${trackDuration}s`;
          obstacle.style.animationDelay = `${-initialPhase}s`;
          loader.insertBefore(obstacle, ground);
        });
      }
      configureMotion();
      new ResizeObserver(configureMotion).observe(loader);
    </script>
  </body>
</html>
